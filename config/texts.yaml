notice: "Independent preparation tool. Not part of Intreo, the Department of Social Protection or any LDC. No guarantee of approval. Results are indicative."
premature_trading: "IMPORTANT: Do not start trading before your BTWEA application is approved. The scheme is for a new business that is not yet operating, and a business already running before the application is not eligible."
revenue_timing: "Revenue registration: the DSP guidelines say your LDC should advise you to register with Revenue at the outset or at the latest by your 3-month review. Registering can trigger a Commencement of Employment form at Intreo, so ask your Employment Personal Adviser or LDC when to register (Form TR1). Evidence of registration is needed at the final recommendation stage or at the 3-month review."
